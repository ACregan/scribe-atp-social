default:
  tags:
    - SERVER-docker-runner

stages:
  - typecheck
  - test
  - deploy

typecheck:
  stage: typecheck
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.ts"
        - "**/*.json"
        - ".gitlab-ci.yml"

test:
  stage: test
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run test:run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.ts"
        - "**/*.json"
        - ".gitlab-ci.yml"

# Fly (ADR 0097 in skyscribe-app). Manual, on main only. Needs the
# FLY_API_TOKEN CI variable (a deploy token for the skyscribe-social app).
deploy:
  stage: deploy
  needs: []
  cache: []
  image: alpine:3.24
  interruptible: false
  environment:
    name: production
    url: https://social.skyscribe.app
  script:
    - apk add --no-cache curl
    - curl --retry 3 --retry-delay 5 --retry-all-errors -L -o /tmp/fly-install.sh https://fly.io/install.sh
    - sh /tmp/fly-install.sh
    - export PATH="$HOME/.fly/bin:$PATH"
    - flyctl deploy --remote-only
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
